<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Debugging Exercise</title>
</head>
<body>
    <h1>Dashboard Status</h1>
    <div id="display"></div>
 
    <script>
        // Weekly Goal: Calculate the total weekly task goal for a user.
        
        // Declare variables and values
        let userName = "Jane Doe";
        let dailyGoal = 5; 
        // FIXED: Removed "" from bonusTasks to make variable a number instead of a string.
        let bonusTasks = 2; 
 
        // Output message to console
        // FIXED: Added missing parenthesis to conole.log.
        console.log("Checking status for: " + userName); 
 
        // Calculate weekly goal based on number of workdays (5) per week
        // FIXED: Updated spelling of variable name from dialygoal to dailyGoal.
        // FIXED: Updated dailyGoal to be multiplied by 5 instead 15
        let weeklyGoal = dailyGoal * 5; 
 
        // Add bonusTasks to weeklyGoal. 
        // Note: Check for data type issues
        // FIXED: Changed subtraction operator to addition operator to correctly calculate totalGoal.
        let totalGoal = weeklyGoal + bonusTasks; 
 
        // Output results to web page
        document.write("User: " + userName + "<br>");
        // FIXED: Removed totalGoal from inside the quotes to correctly display the value of totalGoal.
        document.write("Total Weekly Goal:  " + totalGoal);
 
    </script>
</body>
</html>
